  <!-- Aerodynamic Basket Rib / Slat -->
  <path d="M100,116 L206,116" stroke="url(#nexus-cart-gradient)" stroke-width="14" stroke-linecap="round" />

  <!-- Concentric Wheel 1 (Matches reference vortex center) -->
  <circle cx="114" cy="204" r="18" stroke="url(#nexus-cart-gradient)" stroke-width="14" fill="none" />
  <circle cx="114" cy="204" r="5" fill="url(#nexus-cart-gradient)" />

  <!-- Concentric Wheel 2 -->
  <circle cx="186" cy="204" r="18" stroke="url(#nexus-cart-gradient)" stroke-width="14" fill="none" />
  <circle cx="186" cy="204" r="5" fill="url(#nexus-cart-gradient)" />

  <!-- Floating Orbital Cargo Capsules (Matches reference orbital dashes) -->
  <path d="M136,44 C144,44 152,44 160,44" stroke="url(#nexus-cart-gradient)" stroke-width="14" stroke-linecap="round" />
  <path d="M178,54 C184,54 190,56 196,60" stroke="url(#nexus-cart-gradient)" stroke-width="12" stroke-linecap="round" />
  <path d="M116,56 C112,56 108,58 104,62" stroke="url(#nexus-cart-gradient)" stroke-width="12" stroke-linecap="round" />
</svg>
