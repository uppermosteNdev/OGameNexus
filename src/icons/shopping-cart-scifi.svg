<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="nexus-cart-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2ff" />
      <stop offset="50%" stop-color="#00d2b4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Handle & Chassis Base Frame -->
  <path d="M40,64 L68,64 L96,156 C98,162 104,166 110,166 L198,166 C204,166 210,162 212,156 L228,96 C229,90 225,84 218,84 L78,84"
