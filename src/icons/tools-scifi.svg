<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="nexus-tools-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2ff" />
      <stop offset="50%" stop-color="#00d2b4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Screwdriver (bottom-left to top-right) -->
  <!-- Handle Grip -->
  <path d="M54,202 L86,170" stroke="url(#nexus-tools-gradient)" stroke-width="20" stroke-linecap="round" />
  <!-- Shaft -->
  <path d="M96,160 L176,80" stroke="url(#nexus-tools-gradient)" stroke-width="14" stroke-linecap="round" />
  <!-- Flathead Precision Tip -->
  <path d="M184,72 L198,58" stroke="url(#nexus-tools-gradient)" stroke-width="16" stroke-linecap="round" />

  <!-- Sci-Fi Spanner Wrench (top-left to bottom-right) -->
  <!-- Open Wrench Jaw -->
  <path d="M60,94 C56,76 66,56 84,52 C94,50 106,56 112,66 L92,86 L108,102 L128,82 C138,88 144,100 142,110 C138,128 118,138 100,134" 
        stroke="url(#nexus-tools-gradient)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Wrench Shaft -->
  <path d="M112,122 L172,182" stroke="url(#nexus-tools-gradient)" stroke-width="16" stroke-linecap="round" />
  <!-- Concentric Eyelet (Signature motif matching shopping cart wheels & vortex) -->
  <circle cx="188" cy="198" r="18" stroke="url(#nexus-tools-gradient)" stroke-width="14" fill="none" />
  <circle cx="188" cy="198" r="5" fill="url(#nexus-tools-gradient)" />

  <!-- Floating Orbital Energy / Calibration Capsules (Signature accent) -->
  <path d="M188,38 C194,40 200,44 206,50" stroke="url(#nexus-tools-gradient)" stroke-width="12" stroke-linecap="round" />
  <path d="M38,138 C38,146 40,154 44,160" stroke="url(#nexus-tools-gradient)" stroke-width="12" stroke-linecap="round" />
</svg>
